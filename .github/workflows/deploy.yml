name: ci-cd pipeline - migraciones db

# se ejecuta cuando hago push a la rama deploy
on:
  push:
    branches:
      - develop

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # paso 1 - bajar el codigo (incluye los scripts sql)
      - name: checkout
        uses: actions/checkout@v4

      # paso 2 - copiar los scripts sql a la ec2 privada via bastion
      # proxy_host = ec2 publica del front, host = ec2 privada con mysql
      - name: copiar scripts sql
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DATA_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          source: "*.sql"
          target: "/home/${{ secrets.EC2_USER }}/migrations"

      # paso 3 - levantar mysql en docker (solo si no esta corriendo) y ejecutar migraciones
      - name: deploy mysql y ejecutar migraciones
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DATA_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # levantar el contenedor de mysql solo si no esta corriendo
            # el volumen mysql_data persiste los datos entre reinicios
            if [ ! "$(docker ps -q -f name=mysql-data)" ]; then
              docker rm mysql-data 2>/dev/null || true

              docker run -d \
                --name mysql-data \
                --restart always \
                -p 3306:3306 \
                -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
                -e MYSQL_DATABASE=proyecto_db \
                -v mysql_data:/var/lib/mysql \
                mysql:8.0

              echo "Esperando que MySQL inicie..."
              sleep 30
            fi

            # ejecutar migraciones dentro del contenedor
            # 01 - crear base de datos y tablas (idempotente)
            docker exec -i mysql-data mysql -u root -p${{ secrets.DB_ROOT_PASSWORD }} < ~/migrations/01_creacion_base_datos.sql

            # 02 - procedimientos, funciones y triggers (--force para re-runs)
            docker exec -i mysql-data mysql -u root -p${{ secrets.DB_ROOT_PASSWORD }} --force < ~/migrations/02_backup_y_mantenimiento.sql

            echo "Migraciones ejecutadas exitosamente"
