name: ci-cd pipeline - migraciones db

on:
  push:
    # Rama deploy para ejecutar migraciones a data, se hace push a esta rama desde back cada vez que se actualizan los scripts sql
    branches:
      - deploy

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # paso 1 - bajar el codigo
      - name: checkout
        uses: actions/checkout@v4

      # paso 2 - copiar sql a back (intermediario) via front como proxy
      - name: copiar scripts sql a back
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACK_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_BACK_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_FRONT_SSH_KEY }}
          source: "*.sql"
          target: "/home/${{ secrets.EC2_USER }}/migrations"

      # paso 3 - conectar a back (via front), desde back saltar a data
      # appleboy solo soporta un nivel de proxy, el segundo salto lo hace ssh nativo desde back
      - name: deploy mysql y ejecutar migraciones via back
        uses: appleboy/ssh-action@v1.0.3
        env:
          JUMP_KEY: ${{ secrets.EC2_DATA_SSH_KEY }}
        with:
          host: ${{ secrets.EC2_BACK_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_BACK_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_FRONT_SSH_KEY }}
          envs: JUMP_KEY
          script: |
            mkdir -p ~/.ssh ~/migrations

            # escribir clave ssh para saltar de back a data
            echo "$JUMP_KEY" | tr -d '\r' > ~/.ssh/jump_key
            chmod 600 ~/.ssh/jump_key

            # crear directorio en data y copiar sql desde back
            ssh -i ~/.ssh/jump_key -o StrictHostKeyChecking=no \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_DATA_HOST }}" "mkdir -p ~/migrations"

            scp -i ~/.ssh/jump_key -o StrictHostKeyChecking=no \
              ~/migrations/*.sql \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_DATA_HOST }}:~/migrations/"

            # generar script que se ejecutara en data
            cat > /tmp/data_deploy.sh << SCRIPTEOF
            #!/bin/bash
            set -e

            if [ ! "\$(docker ps -q -f name=mysql-data)" ]; then
              docker rm mysql-data 2>/dev/null || true
              docker run -d \\
                --name mysql-data \\
                --restart always \\
                -p 3306:3306 \\
                -e MYSQL_ROOT_PASSWORD="${{ secrets.DB_ROOT_PASSWORD }}" \\
                -e MYSQL_DATABASE=proyecto_db \\
                -v mysql_data:/var/lib/mysql \\
                mysql:8.0
              echo "Esperando que MySQL inicie..."
              sleep 30
            fi

            docker exec -i mysql-data mysql -uroot -p"${{ secrets.DB_ROOT_PASSWORD }}" < ~/migrations/01_creacion_base_datos.sql
            docker exec -i mysql-data mysql -uroot -p"${{ secrets.DB_ROOT_PASSWORD }}" proyecto_db --force < ~/migrations/02_backup_y_mantenimiento.sql
            echo "Migraciones ejecutadas exitosamente"
            SCRIPTEOF

            # enviar el script a data y ejecutarlo
            scp -i ~/.ssh/jump_key -o StrictHostKeyChecking=no \
              /tmp/data_deploy.sh "${{ secrets.EC2_USER }}@${{ secrets.EC2_DATA_HOST }}:/tmp/"

            ssh -i ~/.ssh/jump_key -o StrictHostKeyChecking=no \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_DATA_HOST }}" "bash /tmp/data_deploy.sh"

            # limpiar
            rm -f ~/.ssh/jump_key /tmp/data_deploy.sh
